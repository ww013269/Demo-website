<style>
  :root{
    --bg:#EDEFE4;
    --card:#FBF8F1;
    --ink:#1F2E2B;
    --ink-soft:#52645E;
    --pink:#C23B5B;
    --gold:#D9A441;
    --jade:#2F6F62;
    --line:#D8D2C0;
    --candidate-bg:#F3ECDD;
    --radius-card:14px;
    --radius-pill:999px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    font-feature-settings:"tnum" 1;
  }
  h1,h2,h3,.display{
    font-family:'Noto Serif TC', serif;
    margin:0;
    color:var(--ink);
  }
  a{color:var(--jade);}
  :focus-visible{outline:2px solid var(--jade); outline-offset:2px;}

  .wrap{max-width:640px; margin:0 auto; padding:0 18px 56px;}

  /* ---------- Header ---------- */
  header.hero{
    position:relative;
    padding:38px 18px 26px;
    margin-bottom:6px;
    overflow:hidden;
    background:var(--jade);
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(217,164,65,.35) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-45deg, rgba(194,59,91,.35) 0 2px, transparent 2px 34px);
    opacity:.6;
  }
  header.hero .inner{
    position:relative; max-width:640px; margin:0 auto; text-align:center; color:#FBF8F1;
  }
  header.hero .eyebrow{
    font-size:.82rem; color:#F3ECDD; opacity:.85; margin-bottom:6px; letter-spacing:.02em;
  }
  header.hero h1{
    font-size:clamp(1.5rem, 5vw, 2.1rem);
    font-weight:700;
    color:#FFFDF7;
  }
  header.hero p.sub{
    margin-top:8px; color:#F3ECDD; font-size:.95rem;
  }

  /* ---------- Day tabs ---------- */
  nav.day-tabs{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:12px 0 10px;
    display:flex; gap:8px; overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  nav.day-tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:7px 14px;
    border-radius:var(--radius-pill);
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink-soft);
    font-size:.78rem;
    line-height:1.25;
  }
  .tab strong{font-family:'Noto Serif TC', serif; font-size:.95rem; color:var(--ink); font-weight:600;}
  .tab.active{
    background:var(--jade); border-color:var(--jade);
    color:#F3ECDD;
  }
  .tab.active strong{color:#FFFDF7;}
  .tab.holiday::after{
    content:"假日";
    margin-top:2px;
    font-size:.62rem;
    padding:1px 6px;
    border-radius:var(--radius-pill);
    background:var(--pink);
    color:#fff;
  }

  /* ---------- Day panel ---------- */
  .day-panel{display:none; padding-top:20px; animation:fadeSlide .25s ease;}
  .day-panel.active{display:block;}
  @keyframes fadeSlide{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .day-panel{animation:none;}
  }

  .day-head h2{font-size:1.25rem; font-weight:600;}
  .day-head .date{color:var(--ink-soft); font-size:.85rem; margin-top:2px;}
  .day-head .theme{margin-top:6px; font-size:.98rem; color:var(--jade); font-weight:500;}

  .holiday-note{
    margin-top:12px; padding:10px 12px;
    background:#FBEFE9; border:1px solid var(--pink);
    border-radius:10px; font-size:.85rem; color:#7A2C40;
  }

  .map-embed{
    margin-top:14px; border-radius:var(--radius-card); overflow:hidden;
    border:1px solid var(--line);
  }
  .map-embed iframe{display:block; width:100%; height:180px; border:0;}

  /* ---------- Timeline ---------- */
  .timeline{
    position:relative; margin-top:20px; padding-left:20px;
  }
  .timeline::before{
    content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px;
    background:var(--line);
  }
  .stop{position:relative; padding-bottom:20px;}
  .stop:last-child{padding-bottom:0;}
  .stop::before{
    content:""; position:absolute; left:-20px; top:5px;
    width:9px; height:9px; border-radius:50%;
    background:var(--gold); border:2px solid var(--bg);
  }
  .stop__time{
    font-size:.78rem; color:var(--ink-soft); font-weight:500;
  }
  .stop__title{
    margin-top:2px; font-size:.98rem; font-weight:500;
  }
  .stop__note{
    margin-top:3px; font-size:.83rem; color:var(--ink-soft);
  }
  .stop__link{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:6px; font-size:.78rem; color:var(--jade);
    text-decoration:none; border-bottom:1px solid transparent;
  }
  .stop__link:hover{border-bottom-color:var(--jade);}
  .stop__link svg{width:12px; height:12px; flex:0 0 auto;}

  /* ---------- Food candidates ---------- */
  .candidates{margin-top:28px;}
  .candidates h3{
    display:flex; align-items:center; gap:6px;
    font-size:1.02rem; font-weight:600;
  }
  .candidates h3 svg{width:16px; height:16px; color:var(--pink);}
  .candidates .hint{font-size:.8rem; color:var(--ink-soft); margin-top:2px;}

  .candidate-grid{
    margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  @media (max-width:420px){
    .candidate-grid{grid-template-columns:1fr;}
  }
  .candidate{
    background:var(--candidate-bg);
    border:1px dashed #B98F3E;
    border-radius:10px;
    padding:10px 12px;
  }
  .candidate .tag{
    display:inline-block; font-size:.68rem; color:#7A5416;
    background:rgba(217,164,65,.28); padding:1px 7px; border-radius:var(--radius-pill);
    margin-bottom:5px;
  }
  .candidate .name{font-weight:600; font-size:.9rem;}
  .candidate .desc{font-size:.8rem; color:var(--ink-soft); margin-top:3px;}
  .candidate .stop__link{margin-top:7px;}

  .no-candidate{
    margin-top:12px; font-size:.85rem; color:var(--ink-soft); font-style:normal;
  }

  footer{
    max-width:640px; margin:34px auto 0; padding:0 18px;
    font-size:.78rem; color:var(--ink-soft);
  }
  footer .line{margin-top:6px;}
</style>

function stopHTML(s){
  const link = s.map ? `<a class="stop__link" href="${mapLink(s.map)}" target="_blank" rel="noopener">${PIN}在地圖開啟</a>` : '';
  const note = s.note ? `<div class="stop__note">${s.note}</div>` : '';
  return `<div class="stop">
      <div class="stop__time">${s.time}</div>
      <div class="stop__title">${s.title}</div>
      ${note}
      ${link}
    </div>`;
}

      <span class="tag">${c.tag}</span>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div>
      <a class="stop__link" href="${mapLink(c.map)}" target="_blank" rel="noopener">${PIN}在地圖開啟</a>
    </div>`;
}

function dayPanelHTML(d){
  const holidayNote = d.holiday
    ? `<div class="holiday-note">今天是「Hari Malaysia 馬來西亞日」國定假日，熱門景點與夜市人潮會比平常多，行程之間建議多留緩衝時間。</div>`
    : '';
  const candidatesBlock = d.candidates.length
    ? `<div class="candidates">
         <h3>${FORK}附近美食候補</h3>
         <div class="hint">虛線卡片，行程有餘裕再插入，不影響原本安排。</div>
         <div class="candidate-grid">${d.candidates.map(candidateHTML).join('')}</div>
       </div>`
    : '';
  return `<section class="day-panel" id="day-${d.id}">
      <div class="day-head">
        <h2>Day ${d.id}｜${d.date}（星期${d.weekday}）</h2>
        <div class="theme">${d.theme}</div>
      </div>
      ${holidayNote}
      <div class="map-embed"><iframe src="${mapEmbed(d.heroMap)}" loading="lazy" title="Day ${d.id} 地圖"></iframe></div>
      <div class="timeline">${d.stops.map(stopHTML).join('')}</div>
      ${candidatesBlock}
    </section>`;
}

const tabsEl = document.getElementById('dayTabs');
const panelsEl = document.getElementById('dayPanels');

tabsEl.innerHTML = days.map(d =>
  `<div class="tab${d.holiday ? ' holiday' : ''}" data-day="${d.id}"><strong>Day ${d.id}</strong>${d.weekday}</div>`
).join('');

panelsEl.innerHTML = days.map(dayPanelHTML).join('');

function showDay(id){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.day == id));
  document.querySelectorAll('.day-panel').forEach(p => p.classList.toggle('active', p.id === 'day-' + id));
}

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  showDay(tab.dataset.day);
});

showDay(1);
</script>
</body>
</html>
