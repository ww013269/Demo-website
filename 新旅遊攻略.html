      };

        "https://www.google.com/maps/search/?api=1&query=" + enc(q);
      const dir = (a, b, m) =>
        "https://www.google.com/maps/dir/?api=1&origin=" +
        enc(a) +
        "&destination=" +
        enc(b) +
        "&travelmode=" +
        m;
      const pics = (q) => "https://www.google.com/search?tbm=isch&q=" + enc(q);
      function fullRoute(day) {
        const pts = day.s
          .map((x) => x.q)
          .filter((v, i, a) => a.indexOf(v) === i);
        const mid = pts.slice(1, -1).slice(0, 8);
        let u =
          "https://www.google.com/maps/dir/?api=1&origin=" +
          enc(pts[0]) +
          "&destination=" +
          enc(pts[pts.length - 1]) +
          "&travelmode=" +
          day.mode;
        if (mid.length) u += "&waypoints=" + mid.map(enc).join("%7C");
        return u;
      }
      let state = {},
        cur = -1,
        vk = "play";
      function loadPhotos() {
        document.querySelectorAll("[data-wiki]").forEach((el) => {
          const t = el.getAttribute("data-wiki");
          fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + t)
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then((j) => {
              const src =
                (j.originalimage && j.originalimage.source) ||
                (j.thumbnail && j.thumbnail.source);
              if (!src) return;
              const im = new Image();
              im.onload = () => {
                el.innerHTML =
                  '<img src="' +
                  src +
                  '" alt="">' +
                  el.getAttribute("data-cap");
              };
              im.src = src;
            })
            .catch(() => {});
        });
      }
      function renderPrep() {

          V.tag +

          h += "<div><b>" + x[0] + "</b><div>" + x[1] + "</div></div>";

            x[1] +

          h +=
            "<div><b>✓</b><div><strong>" +
            x[0] +
            "</strong><br>" +
            x[1] +
            "</div></div>";

        h += '</div><div class="sechead">要先訂什麼</div>';
        const LB = { must: "一定要訂", rec: "建議先訂", no: "現場買就好" };

          h +=
            '<div class="dfrow ' +
            b.lv +
            '"><span class="tt" style="text-align:left;color:#8A5E08;margin:0 0 4px">' +

            "</span><b>" +
            b.n +
            "</b><p>" +
            b.p +
            "</p>";

              '<p style="margin-top:9px"><a href="' +
              b.u +
              '" target="_blank" rel="noopener">前往訂票 →</a></p>';

          h +=
            '<div class="kv"><b>' + n[0] + "</b><div>" + n[1] + "</div></div>";
        });
        h += "</div>";
        document.getElementById("days").innerHTML = h;

      function render() {
        const V = VER[vk],

        [

          ["culture", "HERITAGE"],

          const b = document.createElement("button");

          b.innerHTML = VER[v[0]].name + "<small>" + v[1] + "</small>";
          b.onclick = () => {
            vk = v[0];
            cur = -1;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          vsw.appendChild(b);
        });
        document.getElementById("vdesc").textContent = V.desc;
        const tabs = document.getElementById("tabs"),
          box = document.getElementById("days");

        const bt = document.createElement("button");
        bt.className = "tab" + (cur === -1 ? " on" : "");

          cur = -1;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        tabs.appendChild(bt);
        DAYS.forEach((day, di) => {
          const b = document.createElement("button");
          b.className = "tab" + (di === cur ? " on" : "");
          b.innerHTML = day.d + "<b>" + day.w + "</b>";
          b.onclick = () => {
            cur = di;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          tabs.appendChild(b);

        if (cur === -1) {
          renderPrep();
          return;

        const day = DAYS[cur];
        let h =
          '<div class="dayhead"><p class="sub">DAY ' +
          (cur + 1) +
          " · " +
          day.d +
          " " +
          day.w +
          " · " +
          V.tag +
          "</p><h2>" +
          day.title +
          "</h2>" +
          "<p>" +
          day.note +
          '</p><span class="basechip">🛏 ' +
          day.base +

          (day.dr

              day.dr.lv +

              day.dr.h +

              day.dr.p +
              "<em>建議：" +
              day.dr.tip +

            : "") +
          '</div><a class="routebtn" target="_blank" rel="noopener" href="' +
          fullRoute(day) +
          '">用 Google Map 開啟今天整條路線<small>OPEN FULL DAY ROUTE</small></a><div class="stops">';
        day.s.forEach((x, i) => {
          const prev = i > 0 ? day.s[i - 1].q : null,
            md = MODE[x.m],
            key = vk + "-" + cur + "-" + i;
          const cap = '<span class="cap">' + x.e + "</span>";
          h +=
            '<div class="stop' +
            (state[key] ? " done" : "") +
            '"><div class="dot"><i></i><span class="tt">' +
            x.t +
            '</span></div><div class="body">';
          h +=
            '<a class="ph" href="' +
            pics(x.q) +
            '" target="_blank" rel="noopener"' +
            (x.wiki
              ? ' data-wiki="' + x.wiki + "\" data-cap='" + cap + "'"
              : "") +
            ">" +
            '<span class="fb">📷 ' +
            x.n +
            "<span>點一下看更多照片</span></span>" +
            cap +
            "</a>";
          h += '<div class="inner">';
          if (md) h += '<span class="mode ' + x.m + '">' + md[1] + "</span>";
          if (x.lg) h += '<span class="lg">↑ ' + x.lg + "</span>";
          h += "<h3>" + x.n + '</h3><span class="en">' + x.e + "</span>";
          if (x.p) h += "<p>" + x.p + "</p>";
          if (x.hl) h += '<div class="hl"><span>招牌</span>' + x.hl + "</div>";
          if (x.w) h += '<p class="warnline">⚠ ' + x.w + "</p>";
          if (x.dur || x.fee) {
            h += '<div class="chips">';
            if (x.dur) h += "<span>⏱ " + x.dur + "</span>";
            if (x.fee) h += "<span>💵 " + x.fee + "</span>";
            h += "</div>";
          }
          h +=
            '<div class="acts"><a class="act" target="_blank" rel="noopener" href="' +
            pin(x.q) +
            '">📍 地圖</a>';
          if (prev && md)
            h +=
              '<a class="act nav" target="_blank" rel="noopener" href="' +
              dir(prev, x.q, md[0]) +
              '">🧭 導航</a>';
          h +=
            '<button class="chk" data-k="' +
            key +
            '">' +
            (state[key] ? "✓" : "") +
            "</button></div></div></div></div>";
        });
        h += "</div>";
        box.innerHTML = h;
        box.querySelectorAll(".chk").forEach(
          (el) =>
            (el.onclick = () => {
              state[el.dataset.k] = !state[el.dataset.k];
              el.closest(".stop").classList.toggle("done", state[el.dataset.k]);
              el.textContent = state[el.dataset.k] ? "✓" : "";
            }),
        );
        loadPhotos();
      }
      (function () {
        const t = new Date(),
          iso =
            t.getFullYear() +
            "-" +
            String(t.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(t.getDate()).padStart(2, "0");
        const hit = VER.play.days.findIndex((d) => d.iso === iso);
        if (hit >= 0) cur = hit;
        render();
      })();
